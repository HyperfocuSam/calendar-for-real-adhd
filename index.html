<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar for Real ADHD</title>
<style>
  /* Structure only: what every skin shares. How things LOOK lives in skins/*.css. */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { overflow: hidden; }
  #canvas { position: absolute; inset: 0; }
  .entry {
    position: absolute; width: 180px;
    cursor: grab; user-select: none; touch-action: none;
    animation: float var(--dur, 6s) ease-in-out infinite alternate;
    animation-delay: var(--delay, 0s);
  }
  body.still .entry { animation: none; }
  .entry.dragging { animation: none; cursor: grabbing; z-index: 100000 !important; }
  .entry .text, .entry .date { display: block; overflow-wrap: anywhere; }
  .entry .del { position: absolute; cursor: pointer; }
  .entry .move { display: block; max-width: 100%; cursor: pointer; }
  @keyframes float {
    from { transform: translate(var(--dx0), var(--dy0)); }
    to   { transform: translate(var(--dx1), var(--dy1)); }
  }
  .pill { cursor: pointer; z-index: 5; }
  #log { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  #save, #dock-right, #title, #brand, #pages, #status { position: fixed; z-index: 5; }
  #title, #brand { user-select: none; }
  #dock-right, #pages { display: flex; }
  #status { display: none; }
  #status.show { display: block; }
  #overlay, #done-overlay {
    position: fixed; inset: 0; z-index: 20;
    display: none; align-items: center; justify-content: center;
  }
  #overlay.open, #done-overlay.open { display: flex; }
  #dialog, #done-dialog { display: flex; flex-direction: column; }
  #dialog button.danger { display: none; }
  #dialog.editing button.danger { display: inline-block; }
  #done-list { overflow-y: auto; }
  .done-row { display: flex; align-items: center; }
  .done-row .txt { flex: 1; min-width: 0; }
  .done-row .name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: line-through; }
  .done-row .revert, .done-row .del { flex-shrink: 0; cursor: pointer; }
  /* optional parts: hidden until a skin shows them */
  #brand, #title .room, #title .info, .entry .dnum, .entry .rank, #save kbd, #pages .lbl { display: none; }
</style>
<!-- Skins: one CSS file each in skins/. The first one is the default. Add yours as one more line. -->
<link rel="stylesheet" href="skins/classic.css" data-skin="classic" data-label="Classic">
<link rel="stylesheet" href="skins/arcade.css" data-skin="arcade" data-label="Arcade">
<script>
  // Switch the remembered skin on before first paint, so the page never flashes the other one.
  (function () {
    let want = null;
    try { want = (JSON.parse(localStorage.getItem('cfra.settings')) || {}).skin; } catch {}
    const all = [...document.querySelectorAll('link[data-skin], style[data-skin]')];
    if (!all.some(el => el.dataset.skin === want)) want = all[0] && all[0].dataset.skin;
    all.forEach(el => { el.disabled = el.dataset.skin !== want; });
    document.documentElement.dataset.skin = want;
  })();
</script>
</head>
<body>

<div id="canvas"></div>
<div id="brand"><span class="logo">Calendar <i>for Real</i> ADHD</span><span class="crumb">&rarr; page 1 &middot; Event</span></div>
<div id="title"><span class="plain"><b>1</b>Event</span><span class="room">~ EvenT ~</span><span class="info"><span></span><span class="hot"></span></span></div>
<div id="pages">
  <button data-page="0"><kbd>0</kbd><span class="lbl">TO-DO</span></button>
  <button data-page="1" class="active"><kbd>1</kbd><span class="lbl">EVENT</span></button>
  <button data-page="2"><kbd>2</kbd><span class="lbl">REMIND</span></button>
  <button data-page="3"><kbd>3</kbd><span class="lbl">AGENT</span></button>
</div>
<button id="log" class="pill">LOG</button>
<button id="save" class="pill"><kbd>&#8984;S</kbd><span class="lbl">SAVE</span></button>
<div id="dock-right">
  <button id="clock" class="pill" title="Done items">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    CLOCK
  </button>
  <button id="float" class="pill" title="Toggle the gentle floating motion">FLOAT ON</button>
  <button id="skin" class="pill" title="Change the look (skins/)">SKIN</button>
</div>
<div id="status"></div>

<div id="overlay">
  <form id="dialog">
    <h2 id="dialog-title">~ LoG ~</h2>
    <div>
      <label for="text">Something</label>
      <textarea id="text" required placeholder="What is it?"></textarea>
    </div>
    <div>
      <label for="date">Day</label>
      <input id="date" type="date" required>
    </div>
    <div class="row">
      <button type="button" id="dialog-delete" class="danger" title="Delete for good (skips CLOCK)">Delete</button>
      <span style="flex:1"></span>
      <button type="button" id="cancel">Cancel</button>
      <button type="submit" class="primary" id="dialog-submit">Add</button>
    </div>
  </form>
</div>

<div id="done-overlay">
  <div id="done-dialog">
    <h2>~ DonE ~</h2>
    <div id="done-list"></div>
  </div>
</div>

<script>
(() => {
  // When opened as a file:// page there is no origin, so talk to the local server directly.
  const BASE = location.protocol === 'file:' ? 'http://localhost:8790' : '';
  const PAGE_NAMES = { 0: 'To-dos', 1: 'Event', 2: 'Reminders', 3: 'Agent' };
  const TODO_PAGE = 0;       // plain to-dos: text + the day it was added; float, delete, nothing else
  const AGENT_PAGE = 3;      // where an agent drops cards; the human moves them on with the dropdown

  const canvas   = document.getElementById('canvas');
  const logBtn   = document.getElementById('log');
  const saveBtn  = document.getElementById('save');
  const saveLbl  = saveBtn.querySelector('.lbl');
  const clockBtn = document.getElementById('clock');
  const floatBtn = document.getElementById('float');
  const skinBtn  = document.getElementById('skin');
  const titleEl  = document.getElementById('title');
  const brandEl  = document.getElementById('brand');
  const pagesEl  = document.getElementById('pages');
  const overlay  = document.getElementById('overlay');
  const dialog   = document.getElementById('dialog');
  const textIn   = document.getElementById('text');
  const dateIn   = document.getElementById('date');
  const status   = document.getElementById('status');
  const doneOverlay = document.getElementById('done-overlay');
  const doneListEl  = document.getElementById('done-list');

  const FLOAT_AMP = 6;     // max px drift in the float animation
  const GAP = 10;          // extra gap between cards
  const EDGE = 16;         // keep-out margin from the window edge
  const DAY = 86400000;

  let page = 1;            // current canvas (1, 2 or 3)
  let entries = [];        // { id, text, date, x?, y? }
  let doneItems = [];      // shared archive { id, text, date, page, doneAt, x?, y? }
  let dirty = false;
  const moved = new Map(); // id -> {x,y} dragged locally but not yet saved
  let settings = { floating: true };

  // ---------- helpers ----------
  const cacheKey = () => `cfra.cache.${page}`;
  function setStatus(msg) {
    status.textContent = msg || '';
    status.classList.toggle('show', !!msg);
  }
  function setDirty(v) {
    dirty = v;
    saveBtn.classList.toggle('dirty', v);
    if (v) saveBtn.classList.remove('saved');
  }
  function cache() { localStorage.setItem(cacheKey(), JSON.stringify(entries)); }
  function cacheDone() { localStorage.setItem('cfra.cache.done', JSON.stringify(doneItems)); }
  const hasPos = e => typeof e.x === 'number' && typeof e.y === 'number';

  function todayMidnight() { const d = new Date(); d.setHours(0,0,0,0); return d; }
  function localISO(d) {
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  }
  function daysFromToday(iso) {
    const [y,m,d] = iso.split('-').map(Number);
    return Math.round((new Date(y, m-1, d) - todayMidnight()) / DAY);
  }
  // soon: within 7 days of today (includes overdue) | later: 8–30 days | far: >30 days
  function frame(iso) {
    const n = daysFromToday(iso);
    if (n < 0)   return 'soon overdue';
    if (n === 0) return 'soon today';
    if (n <= 7)  return 'soon';
    if (n <= 30) return 'later';
    return 'far';
  }

  // ---------- API ----------
  async function request(url, method, body) {
    const res = await fetch(BASE + url, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
    return res.json();
  }
  const api = (method, path = '', body) => request(`/api/entries${path}?page=${page}`, method, body);

  async function loadEntries() {
    try {
      const fresh = await api('GET');
      // Keep unsaved local moves on top of whatever the server has, so a refresh
      // never loses a drag and never hides records added in another window.
      fresh.forEach(e => { const m = moved.get(e.id); if (m) { e.x = m.x; e.y = m.y; } });
      entries = fresh;
      cache();
      setStatus('');
    } catch (e) {
      try { entries = JSON.parse(localStorage.getItem(cacheKey())) || []; } catch { entries = []; }
      setStatus('Backend not reachable. Showing cached data. Start the server with start.command, then open http://localhost:8790');
    }
    render();
  }

  async function addEntry(text, date) {
    try {
      const saved = await api('POST', '', { text, date });
      entries.push(saved);
      cache(); render();
    } catch (e) {
      alert('Could not save: ' + e.message + '\nIs the server running?');
    }
  }

  async function updateEntry(en, text, date) {
    try {
      const saved = await request(`/api/entries/${encodeURIComponent(en.id)}?page=${page}`, 'PUT', { text, date });
      Object.assign(en, saved);
      cache(); render();
    } catch (e) {
      alert('Could not update: ' + e.message + '\nIs the server running?');
    }
  }

  async function deleteEntry(en) {
    try {
      await request(`/api/entries/${encodeURIComponent(en.id)}?page=${page}`, 'DELETE');
      entries = entries.filter(x => x.id !== en.id);
      moved.delete(en.id);
      cache(); render();
    } catch (e) {
      alert('Could not delete: ' + e.message);
    }
  }

  // Move a card to another page: add it there first, then remove it here, so a
  // failure half-way can only ever leave a duplicate, never a loss.
  async function moveEntry(en, to) {
    if (to === page || !PAGE_NAMES[to]) return;
    try {
      await request(`/api/entries?page=${to}`, 'POST', { text: en.text, date: en.date });
      await request(`/api/entries/${encodeURIComponent(en.id)}?page=${page}`, 'DELETE');
      entries = entries.filter(x => x.id !== en.id);
      moved.delete(en.id);
      cache(); render();
      setStatus(`Moved to ${PAGE_NAMES[to]}`); setTimeout(() => setStatus(''), 1500);
    } catch (e) {
      alert('Could not move: ' + e.message);
    }
  }

  async function loadDone() {
    try {
      doneItems = await request('/api/done', 'GET');
      cacheDone();
    } catch (e) {
      try { doneItems = JSON.parse(localStorage.getItem('cfra.cache.done')) || []; } catch { doneItems = []; }
    }
    if (doneOverlay.classList.contains('open')) renderDoneList();
  }

  async function markDone(en) {
    try {
      const body = {};
      if (typeof en.x === 'number') body.x = en.x;
      if (typeof en.y === 'number') body.y = en.y;
      const saved = await request(`/api/entries/${encodeURIComponent(en.id)}/done?page=${page}`, 'POST', body);
      entries = entries.filter(x => x.id !== en.id);
      moved.delete(en.id);
      doneItems = [saved, ...doneItems.filter(x => x.id !== saved.id)];
      cache(); cacheDone(); render();
      if (doneOverlay.classList.contains('open')) renderDoneList();
    } catch (e) {
      alert('Could not mark done: ' + e.message);
    }
  }

  async function revertDone(id) {
    try {
      const { page: origin, entry } = await request('/api/done/' + encodeURIComponent(id) + '/revert', 'POST');
      doneItems = doneItems.filter(x => x.id !== id);
      cacheDone();
      renderDoneList();
      if (origin === page && !entries.some(e => e.id === entry.id)) {
        entries.push(entry);
        cache();
        render();
      }
    } catch (e) {
      alert('Could not revert: ' + e.message);
    }
  }

  async function deleteDone(id) {
    try {
      await request('/api/done/' + encodeURIComponent(id), 'DELETE');
      doneItems = doneItems.filter(x => x.id !== id);
      cacheDone();
      renderDoneList();
    } catch (e) {
      alert('Could not delete: ' + e.message);
    }
  }

  function renderDoneList() {
    doneListEl.innerHTML = '';
    if (!doneItems.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Nothing done yet.';
      doneListEl.appendChild(empty);
      return;
    }
    doneItems.forEach(en => {
      const row = document.createElement('div');
      row.className = 'done-row';
      const txt = document.createElement('div');
      txt.className = 'txt';
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = en.text;
      name.title = en.text;
      const meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = `${PAGE_NAMES[en.page] || 'Page ' + en.page} · ${en.date}`;
      txt.append(name, meta);
      const rev = document.createElement('button');
      rev.type = 'button';
      rev.className = 'revert';
      rev.textContent = 'REVERT';
      rev.addEventListener('click', () => revertDone(en.id));
      const del = document.createElement('span');
      del.className = 'del';
      del.textContent = '×';
      del.title = 'Throw away';
      del.addEventListener('click', () => deleteDone(en.id));
      row.append(txt, rev, del);
      doneListEl.appendChild(row);
    });
  }

  // Quietly persist positions the layout engine just assigned, so a card is placed
  // once and then stays exactly where it is on every reload.
  async function persistPositions(list) {
    if (!list.length) return;
    try {
      await api('PUT', '', list.map(e => ({ id: e.id, text: e.text, date: e.date, x: e.x, y: e.y })));
      cache();
    } catch (e) { /* offline: positions are kept in the cache and saved on the next SAVE */ }
  }

  // SAVE: push the whole canvas (every card's text, date and position) to the backend.
  async function saveAll() {
    saveBtn.disabled = true;
    saveLbl.textContent = 'SAVING…';
    try {
      entries = await api('PUT', '', entries.map(e => ({ id: e.id, text: e.text, date: e.date, x: e.x, y: e.y })));
      moved.clear();
      cache();
      setDirty(false);
      render();
      saveLbl.textContent = 'SAVED';
      saveBtn.classList.add('saved');
      setTimeout(() => { saveLbl.textContent = 'SAVE'; saveBtn.classList.remove('saved'); }, 1500);
    } catch (e) {
      saveLbl.textContent = 'SAVE';
      alert('Could not save: ' + e.message + '\nIs the server running?');
    } finally {
      saveBtn.disabled = false;
    }
  }
  saveBtn.addEventListener('click', saveAll);
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveAll(); }
  });
  window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  // ---------- settings: floating on/off ----------
  function applyFloating() {
    document.body.classList.toggle('still', !settings.floating);
    floatBtn.textContent = settings.floating ? 'FLOAT ON' : 'FLOAT OFF';
    floatBtn.classList.toggle('off', !settings.floating);
    localStorage.setItem('cfra.settings', JSON.stringify(settings));
  }
  async function loadSettings() {
    try { settings = await request('/api/settings', 'GET'); }
    catch { try { settings = JSON.parse(localStorage.getItem('cfra.settings')) || settings; } catch {} }
    applyFloating();
    applySkin();
  }

  // ---------- skins: every <link data-skin> in <head> is one (inlined as <style data-skin> in the standalone build); SKIN cycles through them ----------
  const skinEls = [...document.querySelectorAll('link[data-skin], style[data-skin]')];
  function applySkin() {
    if (!skinEls.some(el => el.dataset.skin === settings.skin)) settings.skin = skinEls[0] && skinEls[0].dataset.skin;
    const cur = skinEls.find(el => el.dataset.skin === settings.skin);
    if (document.documentElement.dataset.skin !== settings.skin) {
      skinEls.forEach(el => { el.disabled = el !== cur; });
      document.documentElement.dataset.skin = settings.skin;
      requestAnimationFrame(() => render());   // a skin changes sizes; lay the cards out around the new ones
    }
    skinBtn.textContent = 'SKIN · ' + ((cur && cur.dataset.label) || settings.skin || '').toUpperCase();
    skinBtn.hidden = skinEls.length < 2;
    localStorage.setItem('cfra.settings', JSON.stringify(settings));
  }
  skinBtn.addEventListener('click', async () => {
    const i = skinEls.findIndex(el => el.dataset.skin === settings.skin);
    settings.skin = skinEls[(i + 1) % skinEls.length].dataset.skin;
    applySkin();
    try { settings = await request('/api/settings', 'PUT', { skin: settings.skin }); applySkin(); }
    catch { /* offline: remembered locally */ }
  });
  floatBtn.addEventListener('click', async () => {
    settings.floating = !settings.floating;
    applyFloating();
    try { settings = await request('/api/settings', 'PUT', { floating: settings.floating }); applyFloating(); }
    catch { /* offline: remembered locally, synced when the server is back */ }
  });

  // ---------- pages ----------
  function pageFromHash() {
    const h = (location.hash || '').replace('#', '');
    if (h === '') return 1;
    const n = Number(h);
    return PAGE_NAMES[n] !== undefined ? n : 1;
  }
  function applyPage(n) {
    page = n;
    // room-title casing from the game ("~ LobbY ~", "~ 11th RooM ~"): last letter of each word up
    const room = PAGE_NAMES[n].split(' ').map(w => w.slice(0, -1) + w.slice(-1).toUpperCase()).join(' ');
    titleEl.querySelector('.plain').innerHTML = `<b>${n}</b>${PAGE_NAMES[n]}`;
    titleEl.querySelector('.room').textContent = `~ ${room} ~`;
    brandEl.querySelector('.crumb').textContent = `→ page ${n} · ${PAGE_NAMES[n]}`;
    document.title = `Calendar for Real ADHD · ${PAGE_NAMES[n]}`;
    pagesEl.querySelectorAll('button').forEach(b => b.classList.toggle('active', Number(b.dataset.page) === n));
  }
  function switchPage(n) {
    if (n === page) return;
    if (dirty && !confirm('You have unsaved moves on this page. Leave without saving?')) return;
    moved.clear(); setDirty(false);
    if (location.hash !== '#' + n) location.hash = '#' + n;   // triggers hashchange -> load
    else { applyPage(n); loadEntries(); }
  }
  pagesEl.addEventListener('click', e => {
    const b = e.target.closest('button[data-page]');
    if (b) switchPage(Number(b.dataset.page));
  });
  window.addEventListener('hashchange', () => { applyPage(pageFromHash()); loadEntries(); });
  document.addEventListener('keydown', e => {
    if (overlay.classList.contains('open') || doneOverlay.classList.contains('open')) return;
    if (['0','1','2','3'].includes(e.key) && !e.metaKey && !e.ctrlKey && !e.altKey) switchPage(Number(e.key));
  });

  // ---------- dialog ----------
  const dialogTitle  = document.getElementById('dialog-title');
  const dialogSubmit = document.getElementById('dialog-submit');
  const dialogDelete = document.getElementById('dialog-delete');
  let editing = null;   // entry being edited, or null when logging a new one

  function openDialog(en) {
    editing = en || null;
    dialog.classList.toggle('editing', !!en);
    dialogTitle.textContent  = en ? '~ EdiT ~' : '~ LoG ~';
    dialogSubmit.textContent = en ? 'Save' : 'Add';
    textIn.value = en ? en.text : '';
    dateIn.value = en ? en.date : localISO(todayMidnight());
    dateIn.closest('div').hidden = (page === TODO_PAGE);   // to-dos carry the day they were added, nothing to pick
    overlay.classList.add('open');
    textIn.focus();
    if (en) textIn.select();
  }
  logBtn.addEventListener('click', () => openDialog(null));
  dialogDelete.addEventListener('click', () => {
    if (!editing) return;
    const en = editing;
    close();
    deleteEntry(en);
  });
  document.getElementById('cancel').addEventListener('click', close);
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    close();
    closeDone();
  });
  function close() { overlay.classList.remove('open'); editing = null; dialog.classList.remove('editing'); }

  function openDone() {
    renderDoneList();
    doneOverlay.classList.add('open');
    loadDone();
  }
  function closeDone() { doneOverlay.classList.remove('open'); }
  clockBtn.addEventListener('click', openDone);
  doneOverlay.addEventListener('click', e => { if (e.target === doneOverlay) closeDone(); });

  dialog.addEventListener('submit', e => {
    e.preventDefault();
    const text = textIn.value.trim();
    const date = page === TODO_PAGE ? (editing ? editing.date : localISO(todayMidnight())) : dateIn.value;
    if (!text || !date) return;
    const en = editing;
    close();
    if (en) updateEntry(en, text, date); else addEntry(text, date);
  });
  textIn.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); dialog.requestSubmit(); }
  });

  // ---------- geometry ----------
  // Rects are in canvas coordinates and already include the float margin + gap.
  function overlaps(r, list) {
    return list.some(o =>
      r.x < o.x + o.w && r.x + r.w > o.x &&
      r.y < o.y + o.h && r.y + r.h > o.y);
  }
  function bounds() {
    return { W: canvas.clientWidth, H: canvas.clientHeight };
  }
  function obstacles() {
    // Fixed UI the cards must never sit on top of.
    return [logBtn, saveBtn, clockBtn, floatBtn, skinBtn, titleEl, brandEl, pagesEl, status]
      .filter(el => el.getClientRects().length > 0)   // fixed elements have no offsetParent; this skips only hidden ones
      .map(el => {
        const r = el.getBoundingClientRect();
        return { x: r.left - GAP, y: r.top - GAP, w: r.width + GAP*2, h: r.height + GAP*2 };
      });
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // Nearest free spot to (x,y), searched in a growing spiral. Never returns an overlap
  // unless the canvas is completely full.
  function nearestFree(x, y, w, h, taken, W, H) {
    const maxX = Math.max(EDGE, W - w - EDGE), maxY = Math.max(EDGE, H - h - EDGE);
    x = clamp(x, EDGE, maxX); y = clamp(y, EDGE, maxY);
    if (!overlaps({ x, y, w, h }, taken)) return { x, y };
    const step = 8;
    for (let r = step; r < Math.max(W, H); r += step) {
      const n = Math.max(8, Math.floor(2 * Math.PI * r / step));
      for (let i = 0; i < n; i++) {
        const a = (i / n) * 2 * Math.PI;
        const cx = clamp(Math.round(x + r * Math.cos(a)), EDGE, maxX);
        const cy = clamp(Math.round(y + r * Math.sin(a)), EDGE, maxY);
        if (!overlaps({ x: cx, y: cy, w, h }, taken)) return { x: cx, y: cy };
      }
    }
    return { x, y };
  }

  // Auto-placement for cards with no saved position: random spot in the group's zone
  // (upper half of the page), widening until a free spot appears.
  function autoSpot(zone, w, h, taken, W, H) {
    const top = 56, bottom = H / 2 - 60;   // below the top bar, above the LOG button
    const tryRandom = (x0, x1, y0, y1, tries) => {
      const sx = Math.max(0, x1 - x0 - w), sy = Math.max(0, y1 - y0 - h);
      for (let i = 0; i < tries; i++) {
        const r = { x: x0 + Math.random()*sx, y: y0 + Math.random()*sy, w, h };
        if (!overlaps(r, taken)) return r;
      }
      return null;
    };
    return tryRandom(zone.x0, zone.x1, top, bottom, 300)
        || tryRandom(Math.max(EDGE, zone.x0 - W*0.15), Math.min(W - EDGE, zone.x1 + W*0.15), top, bottom, 300)
        || tryRandom(EDGE, W - EDGE, top, bottom, 300)
        || nearestFree((zone.x0 + zone.x1) / 2, bottom / 2, w, h, taken, W, H);
  }

  // ---------- render ----------
  // the strip under the room title: how many cards, how many need you this week
  function renderInfo() {
    const [all, hot] = titleEl.querySelectorAll('.info span');
    all.textContent = `${entries.length} CARD${entries.length === 1 ? '' : 'S'}`;
    const n = page === TODO_PAGE ? 0 : entries.filter(e => daysFromToday(e.date) <= 7).length;
    hot.textContent = n ? `${n} THIS WEEK` : '';
  }

  function render() {
    renderInfo();
    canvas.innerHTML = '';
    const { W, H } = bounds();
    const taken = obstacles();
    const M = FLOAT_AMP + GAP / 2;                 // margin around each card box

    const els = new Map();
    entries.forEach(en => { const el = makeEl(en); canvas.appendChild(el); els.set(en.id, el); });

    // 1. Cards with a remembered position go exactly there, even on top of another card:
    //    stacking is the human's call. They are only nudged if the window is now too small
    //    or they sit on a button, and that nudge is NOT saved, so the remembered position survives.
    const ui = taken.slice();
    entries.filter(hasPos).forEach(en => {
      const el = els.get(en.id);
      const w = el.offsetWidth + M*2, h = el.offsetHeight + M*2;
      const p = nearestFree(en.x - M, en.y - M, w, h, ui, W, H);
      taken.push({ x: p.x, y: p.y, w, h });   // new cards still look for a free spot
      place(el, p.x + M, p.y + M);
    });

    // 2. Cards without a position (brand new) are grouped by date frame:
    //    soon (left), later (middle), far (right). Their spot is then remembered.
    const fresh = entries.filter(e => !hasPos(e));
    const groups = { soon: [], later: [], far: [] };
    fresh.forEach(en => groups[frame(en.date).split(' ')[0]].push(en));
    const order = ['soon', 'later', 'far'];
    const usable = W - EDGE*2;
    const counts = order.map(k => groups[k].length);
    const total = counts.reduce((a,b) => a+b, 0);
    if (total) {
      const shares = counts.map(c => c === 0 ? 0 : Math.max(0.2, c / total));
      const sum = shares.reduce((a,b) => a+b, 0);
      let x = EDGE;
      const zones = {};
      order.forEach((k, i) => {
        const wZone = usable * shares[i] / sum;
        zones[k] = { x0: x, x1: x + wZone };
        x += wZone;
      });
      order.forEach(k => {
        groups[k].sort((a,b) => daysFromToday(a.date) - daysFromToday(b.date)).forEach(en => {
          const el = els.get(en.id);
          const w = el.offsetWidth + M*2, h = el.offsetHeight + M*2;
          const p = autoSpot(zones[k], w, h, taken, W, H);
          taken.push({ x: p.x, y: p.y, w, h });
          place(el, p.x + M, p.y + M);
          en.x = Math.round(p.x + M); en.y = Math.round(p.y + M);
        });
      });
      persistPositions(fresh);
    }
  }

  function place(el, x, y) {
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    el._pos = { x, y };
  }

  function makeEl(en) {
    const el = document.createElement('div');
    el.className = page === TODO_PAGE ? 'entry todo' : 'entry ' + frame(en.date);
    const rnd = (a, b) => (a + Math.random()*(b-a)).toFixed(1);
    el.style.setProperty('--dx0', rnd(-FLOAT_AMP, FLOAT_AMP) + 'px');
    el.style.setProperty('--dy0', rnd(-FLOAT_AMP, FLOAT_AMP) + 'px');
    el.style.setProperty('--dx1', rnd(-FLOAT_AMP, FLOAT_AMP) + 'px');
    el.style.setProperty('--dy1', rnd(-FLOAT_AMP, FLOAT_AMP) + 'px');
    el.style.setProperty('--dur', rnd(4, 9) + 's');
    el.style.setProperty('--delay', '-' + rnd(0, 9) + 's');

    const text = document.createElement('span');
    text.className = 'text';
    text.textContent = en.text;
    const date = document.createElement('span');
    date.className = 'date';
    const n = daysFromToday(en.date);
    const rel = n === 0 ? 'today' : n === 1 ? 'tomorrow' : n < 0 ? `${-n}d overdue` : `in ${n}d`;
    const wd = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(...en.date.split('-').map((v,i)=>i===1?Number(v)-1:Number(v))).getDay()];
    date.textContent = page === TODO_PAGE ? `added ${wd} ${en.date}` : `${wd} ${en.date}`;
    if (page !== TODO_PAGE) {
      const r = document.createElement('span');
      r.className = 'rel';
      r.textContent = ` · ${rel}`;
      date.appendChild(r);
    }
    // card plates: countdown on the left, rank tile on the right (SS today/overdue, S this week, A this month, B later)
    const dnum = document.createElement('span');
    dnum.className = 'dnum';
    const rank = document.createElement('span');
    rank.className = 'rank';
    if (page === TODO_PAGE) { dnum.textContent = 'TO-DO'; rank.textContent = '★'; }
    else {
      dnum.textContent = n === 0 ? 'TODAY' : n < 0 ? `${-n}D LATE` : `D-${n}`;
      dnum.title = rel;
      rank.textContent = n <= 0 ? 'SS' : n <= 7 ? 'S' : n <= 30 ? 'A' : 'B';
    }
    const del = document.createElement('span');
    del.className = 'del';
    del.textContent = '×';
    del.title = page === TODO_PAGE ? 'Delete' : 'Remove';
    del.addEventListener('pointerdown', e => e.stopPropagation());
    del.addEventListener('click', e => {
      e.stopPropagation();
      if (page === TODO_PAGE) { if (confirm('Delete this to-do?')) deleteEntry(en); }
      else markDone(en);
    });
    el.append(dnum, rank, text, date, del);
    if (page === AGENT_PAGE) {
      const mv = document.createElement('select');
      mv.className = 'move';
      mv.title = 'Move this card to Events or Reminders';
      mv.innerHTML = '<option value="">move to…</option><option value="1">→ Event</option><option value="2">→ Reminders</option>';
      mv.addEventListener('pointerdown', e => e.stopPropagation());
      mv.addEventListener('dblclick', e => e.stopPropagation());
      mv.addEventListener('change', e => { e.stopPropagation(); const to = Number(mv.value); if (to) moveEntry(en, to); });
      el.appendChild(mv);
    }
    el.title = 'Double-click to edit';
    el.addEventListener('dblclick', e => { e.preventDefault(); openDialog(en); });

    enableDrag(el, en);
    return el;
  }

  // ---------- drag ----------
  let zTop = 1;
  function enableDrag(el, en) {
    let start = null;
    el.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      el.setPointerCapture(e.pointerId);
      el.style.zIndex = ++zTop;   // the card you touch comes to the front
      start = { px: e.clientX, py: e.clientY, x: el._pos.x, y: el._pos.y, moved: false };
      el.classList.add('dragging');
    });
    el.addEventListener('pointermove', e => {
      if (!start) return;
      const dx = e.clientX - start.px, dy = e.clientY - start.py;
      if (Math.abs(dx) + Math.abs(dy) > 2) start.moved = true;
      const { W, H } = bounds();
      const x = clamp(start.x + dx, EDGE, W - el.offsetWidth - EDGE);
      const y = clamp(start.y + dy, EDGE, H - el.offsetHeight - EDGE);
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
    });
    const finish = () => {
      if (!start) return;
      el.classList.remove('dragging');
      const wasMoved = start.moved;
      start = null;
      if (!wasMoved) return;
      // Settle: a card may be dropped on top of other cards (it stays in front);
      // it is only pushed off the buttons so they stay clickable.
      const { W, H } = bounds();
      const M = FLOAT_AMP + GAP / 2;
      const w = el.offsetWidth + M*2, h = el.offsetHeight + M*2;
      const taken = obstacles();
      const p = nearestFree(parseFloat(el.style.left) - M, parseFloat(el.style.top) - M, w, h, taken, W, H);
      place(el, p.x + M, p.y + M);
      en.x = Math.round(p.x + M); en.y = Math.round(p.y + M);
      moved.set(en.id, { x: en.x, y: en.y });
      cache();
      setDirty(true);
    };
    el.addEventListener('pointerup', finish);
    el.addEventListener('pointercancel', finish);
  }

  // ---------- boot ----------
  let resizeTimer;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });
  window.addEventListener('focus', () => { loadEntries(); loadDone(); });
  setInterval(() => { loadEntries(); loadDone(); }, 60 * 1000);   // pick up changes made in another window
  applyPage(pageFromHash());
  loadSettings();
  loadEntries();
  loadDone();
  // the title font changes button sizes once it arrives; lay the cards out again around the real sizes
  if (document.fonts) Promise.all(['400 40px "Lilita One"', '800 14px Nunito'].map(f => document.fonts.load(f).catch(() => {}))).then(() => render());
})();
</script>
</body>
</html>
